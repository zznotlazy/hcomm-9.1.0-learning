name: Learning snapshot and document checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate source evidence
        run: python docs/zh/learning/a2_algorithm_selection/build_evidence.py
      - name: Check upstream snapshot and teaching assets
        run: python docs/zh/learning/a2_algorithm_selection/verify_snapshot.py
      - name: Check reproducibility
        run: git diff --exit-code -- docs/zh/learning/a2_algorithm_selection
